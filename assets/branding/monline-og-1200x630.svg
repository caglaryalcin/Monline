<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Monline — Monthly spending, clearly.</title>
  <desc id="desc">Monline social preview with its green product mark, a monthly budget overview, and subscription cards.</desc>

  <rect width="1200" height="630" fill="#F4F3EE"/>
  <circle cx="1118" cy="-46" r="240" fill="#D8FF68" fill-opacity="0.22"/>
  <circle cx="14" cy="634" r="182" fill="#D8FF68" fill-opacity="0.16"/>

  <g transform="translate(74 70) scale(1.5)">
    <rect x="1" y="1" width="38" height="38" rx="12" fill="#D8FF68"/>
    <path d="M10 28V13h4l6 9 6-9h4v15h-4V20l-6 8-6-8v8z" fill="#1B1D19"/>
  </g>
  <text x="154" y="116" fill="#181A1B" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Monline</text>

  <g fill="#181A1B" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-4">
    <text x="72" y="266">Monthly</text>
    <text x="72" y="354">spending,</text>
    <text x="72" y="442">clearly.</text>
  </g>
  <rect x="76" y="480" width="116" height="8" rx="4" fill="#D8FF68"/>

  <g transform="translate(666 38)" font-family="Segoe UI, Arial, sans-serif">
