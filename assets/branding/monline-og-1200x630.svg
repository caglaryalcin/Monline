    <path d="M36 1H434A35 35 0 0 1 469 36V86H1V36A35 35 0 0 1 36 1Z" fill="#262A25"/>
    <path d="M1 86H469" stroke="#41443B"/>
    <text x="32" y="52" fill="#F4F3EE" font-size="23" font-weight="600" letter-spacing="-0.6">Budget overview</text>
    <text x="438" y="50" text-anchor="end" fill="#A8AAA4" font-size="14">October 2026</text>

    <text x="32" y="124" fill="#A8AAA4" font-size="15">Monthly budget</text>
    <text x="32" y="169" fill="#F4F3EE" font-size="42" font-weight="700" letter-spacing="-1.5">$120.00</text>

    <g transform="translate(32 192)">
      <rect x="0.5" y="0.5" width="196" height="79" rx="13" fill="#22332A" stroke="#34503B"/>
      <text x="16" y="28" fill="#A8AAA4" font-size="14">Paid</text>
      <text x="16" y="58" fill="#75D49B" font-size="25" font-weight="700" letter-spacing="-0.6">$58.92</text>
    </g>
    <g transform="translate(241 192)">
      <rect x="0.5" y="0.5" width="196" height="79" rx="13" fill="#262A25" stroke="#41443B"/>
      <text x="16" y="28" fill="#A8AAA4" font-size="14">Pending</text>
      <text x="16" y="58" fill="#F4F3EE" font-size="25" font-weight="700" letter-spacing="-0.6">$25.98</text>
    </g>

    <defs>
      <linearGradient id="budget-progress" x1="32" y1="0" x2="319" y2="0" gradientUnits="userSpaceOnUse">
        <stop stop-color="#B2D54E"/>
        <stop offset="0.62" stop-color="#D8FF68"/>
        <stop offset="0.77" stop-color="#F2F7DF"/>
        <stop offset="1" stop-color="#D8FF68"/>
      </linearGradient>
    </defs>
    <rect x="32" y="296" width="406" height="8" rx="4" fill="#393D34"/>
    <rect x="32" y="296" width="287" height="8" rx="4" fill="url(#budget-progress)"/>
    <text x="32" y="329" fill="#A8AAA4" font-size="13">This month: <tspan fill="#F4F3EE" font-weight="600">$84.90</tspan></text>
    <text x="438" y="329" text-anchor="end" fill="#F4F3EE" font-size="13" font-weight="600">Remaining: $35.10</text>

    <path d="M32 355H438" stroke="#41443B"/>
    <text x="32" y="387" fill="#F4F3EE" font-size="17" font-weight="600">This month’s subscriptions</text>
    <rect x="410" y="368" width="28" height="26" rx="8" fill="#30352B"/>
    <text x="424" y="386" text-anchor="middle" fill="#B7BAB0" font-size="14">6</text>

    <g transform="translate(32 411)">
      <rect x="0.5" y="0.5" width="43" height="43" rx="13" fill="#191D1B" stroke="#41443B"/>
      <rect x="9" y="13" width="26" height="18" rx="5" stroke="#D8FF68" stroke-width="2"/>
      <path d="M20 18L27 22L20 26V18Z" fill="#D8FF68"/>
