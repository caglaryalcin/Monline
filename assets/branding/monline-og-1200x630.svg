      <text x="58" y="38" fill="#A8AAA4" font-size="13">Oct 6 · <tspan fill="#75D49B">✓ Paid</tspan></text>
      <text x="406" y="26" text-anchor="end" fill="#F4F3EE" font-size="18" font-weight="600">$15.99</text>
    </g>

    <g transform="translate(32 477)">
      <rect x="0.5" y="0.5" width="43" height="43" rx="13" fill="#191D1B" stroke="#41443B"/>
      <path d="M14 29H30C33.3 29 36 26.4 36 23C36 19.8 33.5 17.2 30.4 17C29.3 13 25.8 10.3 21.8 10.3C16.8 10.3 12.8 14.3 12.8 19.3C10.2 20 8.3 21.8 8.3 24.2C8.3 26.9 10.8 29 14 29Z" stroke="#A8AAA4" stroke-width="2" stroke-linejoin="round"/>
      <text x="58" y="16" fill="#F4F3EE" font-size="17" font-weight="600">Cloud storage</text>
      <text x="58" y="38" fill="#A8AAA4" font-size="13">Oct 24 · Payment pending</text>
      <text x="406" y="26" text-anchor="end" fill="#F4F3EE" font-size="18" font-weight="600">$9.99</text>
    </g>
