name: monline-beta
services:
  app:
    build: .
    image: monline:2.0.0-beta.3
    container_name: monline-beta
    restart: unless-stopped
    ports:
      - "${MONLINE_BETA_PORT:-3001}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Istanbul}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MONLINE_PUBLIC_URL: ${MONLINE_PUBLIC_URL:-}
      MONLINE_LEGACY_KEY: ${MONLINE_LEGACY_KEY:-}
    volumes:
      - monline-beta-volume:/data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  monline-beta-volume:
