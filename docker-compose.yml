name: monline
services:
  app:
    build: .
    image: monline:1.0.2
    container_name: monline
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Istanbul}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MONLINE_LEGACY_KEY: ${MONLINE_LEGACY_KEY:-}
    volumes:
      - monline-volume:/data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  monline-volume:
