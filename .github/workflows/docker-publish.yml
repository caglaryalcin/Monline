name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Publish AMD64 and ARM64 images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare image name and verify release version
        id: project
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          web_version = json.loads(Path("apps/web/package.json").read_text())["version"]
          server_version = json.loads(Path("apps/backend/package.json").read_text())["version"]
          if version != web_version or version != server_version:
              raise SystemExit("Root, web and server package versions must match.")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{version}":
                  raise SystemExit("Release tag must match the package version.")

          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image={image}\n")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.project.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Monline
            org.opencontainers.image.description=Self-hosted subscription and recurring payment tracking.
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=monline
          cache-to: type=gha,mode=max,scope=monline

      - name: Inspect published image
        env:
          IMAGE: ${{ steps.project.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE@$DIGEST"

      - name: Write publication summary
        env:
          IMAGE: ${{ steps.project.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Published Docker image\n\n")
              summary.write(f"Image: {os.environ['IMAGE']}@{os.environ['DIGEST']}\n\n")
              summary.write("Platforms: linux/amd64, linux/arm64\n\n")
              summary.write("Tags:\n\n")
              for tag in os.environ["IMAGE_TAGS"].splitlines():
                  summary.write(f"- {tag}\n")
          PY
