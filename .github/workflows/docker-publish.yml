name: Docker Publish

on:
  push:
    branches: [beta]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag; leave empty to publish the selected beta branch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name || '') }}
  DOCKERHUB_IMAGE: caglaryalcin/monline

jobs:
  verify:
    if: github.repository == 'caglaryalcin/Monline'
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}

  build-and-push:
    name: Publish AMD64 and ARM64 images
    needs: verify
    if: github.repository == 'caglaryalcin/Monline'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$VERSION" || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Check out the requested branch or release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate channel, branch ancestry and image tags
        id: project
        run: node scripts/docker-publish.cjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.project.outputs.tags }}
          labels: ${{ steps.project.outputs.labels }}
          cache-from: type=gha,scope=monline
          cache-to: type=gha,mode=max,scope=monline

      - name: Verify the same image in both registries
        env:
          IMAGE: ${{ steps.project.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE@$DIGEST"

      - name: Write publication summary
        env:
          IMAGE: ${{ steps.project.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.project.outputs.tags }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Published Docker images\n\n")
              summary.write(f"GHCR: {os.environ['IMAGE']}@{os.environ['DIGEST']}\n\n")
              summary.write(f"Docker Hub: {os.environ['DOCKERHUB_IMAGE']}@{os.environ['DIGEST']}\n\n")
              summary.write("Platforms: linux/amd64, linux/arm64\n\n")
              summary.write("Tags:\n\n")
              for tag in os.environ["IMAGE_TAGS"].splitlines():
                  summary.write(f"- {tag}\n")
          PY
