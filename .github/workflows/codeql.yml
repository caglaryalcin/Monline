name: CodeQL Advanced

on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
      - "**/*.md"
  schedule:
    - cron: "44 21 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    name: Check CodeQL availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check code scanning availability
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          enabled = True
          reason = "CodeQL analysis is enabled."
          if os.environ["REPOSITORY_PRIVATE"].lower() == "true":
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['REPOSITORY']}/code-scanning/analyses?per_page=1",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      json.load(response)
              except urllib.error.HTTPError as error:
                  message = json.loads(error.read()).get("message", "")
                  if error.code == 403 and "code scanning is not enabled" in message.lower():
                      enabled = False
                      reason = (
                          "CodeQL analysis was skipped: code scanning is not enabled for this private repository. "
                          "Enable GitHub Code Security and code scanning in the repository settings to run it. "
                          "No CodeQL scan was performed."
                      )
                  else:
                      raise

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## CodeQL availability\n\n{reason}\n")
          print(reason)
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: availability
    if: needs.availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
