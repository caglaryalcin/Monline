name: Project Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact branch or tag validated before image publication
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - "screenshots/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd apps/web && bun install --frozen-lockfile
          cd ../backend && bun install --frozen-lockfile --ignore-scripts
      - name: Lint, type checking and production build
        run: |
          bun run lint
          cd apps/web
          bun run type-check
          bun run build
